server {
    listen 443 ssl;
    server_name api.annisaarta.novelle.id;

    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3026;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout   60s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
        send_timeout            60s;
    }

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Aktifkan setelah sertifikat terbit:
    # ssl_certificate     /etc/letsencrypt/live/api.annisaarta.novelle.id/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.annisaarta.novelle.id/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.annisaarta.novelle.id;
    return 301 https://$host$request_uri;
}
